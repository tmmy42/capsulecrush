<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CapsuleCrush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23FF5FA0%22 stroke=%22%231A1A1A%22 stroke-width=%226%22/></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Subtle film-grain overlay for a vintage, less-flat finish -->
<div class="grain-overlay" aria-hidden="true"></div>

<!-- Lucide icon sprite: symbols defined once, referenced via <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="icon-pen" viewBox="0 0 24 24"><path d="M13 21h8"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></symbol>
    <symbol id="icon-image-plus" viewBox="0 0 24 24"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></symbol>
    <symbol id="icon-package-open" viewBox="0 0 24 24"><path d="M12 22v-9"/><path d="M15.17 2.21a1.67 1.67 0 0 1 1.63 0L21 4.57a1.93 1.93 0 0 1 0 3.36L8.82 14.79a1.655 1.655 0 0 1-1.64 0L3 12.43a1.93 1.93 0 0 1 0-3.36z"/><path d="M20 13v3.87a2.06 2.06 0 0 1-1.11 1.83l-6 3.08a1.93 1.93 0 0 1-1.78 0l-6-3.08A2.06 2.06 0 0 1 4 16.87V13"/><path d="M21 12.43a1.93 1.93 0 0 0 0-3.36L8.83 2.2a1.64 1.64 0 0 0-1.63 0L3 4.57a1.93 1.93 0 0 0 0 3.36l12.18 6.86a1.636 1.636 0 0 0 1.63 0z"/></symbol>
    <symbol id="deco-star" viewBox="0 0 40 40">
      <path d="M20 3 C21 12 22 18 30 20 C22 22 21 28 20 37 C19 28 18 22 10 20 C18 18 19 12 20 3 Z" stroke-linejoin="round"/>
    </symbol>
    <symbol id="deco-dot" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="8"/>
    </symbol>
  </defs>
</svg>

<div id="app">

  <!-- ===== AUTH SCREEN ===== -->
  <section id="screen-auth" class="screen screen-auth">
    <svg class="auth-deco deco-star star-a1" aria-hidden="true"><use href="#deco-star"/></svg>
    <svg class="auth-deco deco-dot dot-a1" aria-hidden="true"><use href="#deco-dot"/></svg>
    <svg class="auth-deco deco-star star-a2" aria-hidden="true"><use href="#deco-star"/></svg>
    <svg class="auth-deco deco-dot dot-a2" aria-hidden="true"><use href="#deco-dot"/></svg>
    <div class="auth-card">
      <img src="logo.png" alt="CapsuleCrush" class="logo-image logo-image-auth" />
      <p class="tagline">Capsule the things you love</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true">Log In</button>
        <button class="auth-tab" data-tab="signup" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <form id="form-login" class="auth-form">
        <div class="field">
          <label class="field-label" for="login-username">Your name</label>
          <input type="text" id="login-username" autocomplete="username" required maxlength="32" />
        </div>
        <div class="field">
          <label class="field-label" for="login-passcode">Their name <span class="hint">also your passcode</span></label>
          <input type="password" id="login-passcode" autocomplete="current-password" required maxlength="64" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>

      <form id="form-signup" class="auth-form hidden">
        <div class="field">
          <label class="field-label" for="signup-username">Your name <span class="hint">letters, numbers, underscore · 3-32</span></label>
          <input type="text" id="signup-username" autocomplete="username" required maxlength="32" />
        </div>
        <div class="field">
          <label class="field-label" for="signup-passcode">Their name <span class="hint">this doubles as your passcode</span></label>
          <input type="password" id="signup-passcode" autocomplete="new-password" required maxlength="64" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Get Started</button>
        <p class="form-error" id="signup-error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- ===== HOME (GASHAPON) SCREEN ===== -->
  <section id="screen-home" class="screen screen-home hidden">
    <header class="home-header">
      <img src="logo.png" alt="CapsuleCrush" class="logo-image logo-image-home" />
      <p class="home-subtitle" id="home-subtitle"></p>
      <button id="btn-logout" class="icon-btn logout-floating" title="Log out" aria-label="Log out">
        <svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg>
      </button>
    </header>

    <div class="gasha-stage">
    <div class="machine-scene">
      <!-- Decorative motifs: two shapes only (sparkle + dot), placed along a
           loose arc around the machine with deliberately uneven size/angle,
           some tucked behind the machine so the scene reads as one composition -->
      <svg class="deco deco-star ms-1" aria-hidden="true"><use href="#deco-star"/></svg>
      <svg class="deco deco-dot ms-2" aria-hidden="true"><use href="#deco-dot"/></svg>
      <svg class="deco deco-star ms-3" aria-hidden="true"><use href="#deco-star"/></svg>
      <svg class="deco deco-dot ms-4" aria-hidden="true"><use href="#deco-dot"/></svg>
      <svg class="deco deco-star ms-5" aria-hidden="true"><use href="#deco-star"/></svg>

      <!-- Gashapon machine: traced from the reference illustration's silhouette
           and proportions, but built as independent parts (dome, capsules,
           trim, body, base, dial) each with their own outline and fill —
           recolored in the app's own palette. Only the dial group (#lever)
           is animated; every other part stays completely still. -->
      <svg class="machine" viewBox="0 0 220 300" aria-hidden="true">
        <defs>
          <clipPath id="dome-clip"><circle cx="110" cy="116" r="90"/></clipPath>

          <linearGradient id="grad-cap" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF9FCB"/>
            <stop offset="100%" stop-color="#FF5FA0"/>
          </linearGradient>
          <radialGradient id="grad-dome-glass" cx="34%" cy="26%" r="82%">
            <stop offset="0%" stop-color="#F5FFFA"/>
            <stop offset="55%" stop-color="#D2F3E4"/>
            <stop offset="100%" stop-color="#DAD0F7"/>
          </radialGradient>
          <linearGradient id="grad-machine-trim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A9E8CB"/>
            <stop offset="100%" stop-color="#8AD9B4"/>
          </linearGradient>
          <linearGradient id="grad-machine-body" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFE07A"/>
            <stop offset="55%" stop-color="#FFD23F"/>
            <stop offset="100%" stop-color="#F0B90E"/>
          </linearGradient>
          <linearGradient id="grad-machine-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF8FC3"/>
            <stop offset="100%" stop-color="#FF5FA0"/>
          </linearGradient>
          <radialGradient id="grad-dial" cx="34%" cy="28%" r="80%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E3E3DC"/>
          </radialGradient>
        </defs>

        <ellipse class="machine-shadow" cx="110" cy="292" rx="88" ry="8"/>

        <!-- part: dome (static) -->
        <g class="machine-part machine-part-dome">
          <circle cx="110" cy="116" r="90" fill="url(#grad-dome-glass)" stroke="#1A1A1A" stroke-width="2.6"/>
          <ellipse cx="76" cy="62" rx="18" ry="34" fill="#fff" opacity=".5" transform="rotate(-16 76 62)"/>
          <path d="M84,24 C84,10 96,4 110,4 C124,4 136,10 136,24 Z" fill="url(#grad-cap)" stroke="#1A1A1A" stroke-width="2.6"/>
        </g>

        <!-- part: capsules piled inside the dome (static) — a small, loose
             cluster of six same-size balls near the bottom of the dome, not
             packed edge-to-edge; later balls overlap earlier ones so the
             pile still reads with a little front-to-back depth -->
        <g class="machine-part machine-part-capsules" clip-path="url(#dome-clip)">
          <circle cx="88" cy="140" r="16" fill="#FFD23F" stroke="#1A1A1A" stroke-width="2"/>
          <circle cx="132" cy="138" r="16" fill="#43C6F0" stroke="#1A1A1A" stroke-width="2"/>
          <circle cx="66" cy="170" r="16" fill="#8F6FEF" stroke="#1A1A1A" stroke-width="2"/>
          <circle cx="110" cy="172" r="16" fill="#FF5FA0" stroke="#1A1A1A" stroke-width="2"/>
          <circle cx="154" cy="168" r="16" fill="#FFD23F" stroke="#1A1A1A" stroke-width="2"/>
          <circle cx="110" cy="200" r="16" fill="#43C6F0" stroke="#1A1A1A" stroke-width="2"/>

          <ellipse cx="83" cy="136" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
          <ellipse cx="127" cy="134" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
          <ellipse cx="61" cy="166" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
          <ellipse cx="105" cy="168" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
          <ellipse cx="149" cy="164" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
          <ellipse cx="105" cy="196" rx="4.5" ry="6" fill="#fff" opacity=".85"/>
        </g>

        <!-- part: trim / coin plate (static) -->
        <g class="machine-part machine-part-trim">
          <rect x="24" y="200" width="172" height="20" rx="10" fill="url(#grad-machine-trim)" stroke="#1A1A1A" stroke-width="2.6"/>
          <rect x="100" y="206" width="20" height="7" rx="3" fill="#1A1A1A" opacity=".7"/>
        </g>

        <!-- part: body (static) -->
        <g class="machine-part machine-part-body">
          <rect x="28" y="214" width="164" height="66" rx="16" fill="url(#grad-machine-body)" stroke="#1A1A1A" stroke-width="2.6"/>
        </g>

        <!-- part: base (static) — a trapezoid that flares outward toward
             the bottom, per the reference illustration, rather than a
             rounded bar -->
        <g class="machine-part machine-part-base">
          <polygon points="40,274 180,274 206,294 14,294" fill="url(#grad-machine-base)" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
        </g>

        <!-- part: dial / knob — the ONLY part that moves. transform-origin
             is the dial's own center, so pulling the gasha spins just this
             group while the dome/body/base stay put. -->
        <g id="lever" class="machine-part machine-part-dial">
          <circle cx="110" cy="246" r="22" fill="url(#grad-dial)" stroke="#1A1A1A" stroke-width="2.4"/>
          <rect x="98" y="243.5" width="24" height="5" rx="2.5" fill="#1A1A1A" opacity=".8"/>
        </g>
      </svg>

      <div id="falling-capsule" class="falling-capsule hidden">
        <div class="capsule-top"></div>
        <div class="capsule-bottom"></div>
      </div>
    </div>

      <button id="btn-gasha" class="btn btn-gasha">
        <svg class="icon" aria-hidden="true"><use href="#icon-rotate"/></svg>
        Pull the Lever
      </button>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <p id="empty-state-text">No capsules yet — start your collection.</p>
      <button class="btn btn-secondary" data-nav="post">Add Your First Capsule</button>
    </div>

    <!-- Result modal -->
    <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-text">
      <div class="modal-card">
        <button class="icon-btn modal-close" id="result-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"/></svg>
        </button>
        <svg class="capsule-open-icon" aria-hidden="true"><use href="#icon-package-open"/></svg>
        <p class="result-date" id="result-date"></p>
        <p class="result-text" id="result-text" lang="ja"></p>
        <img id="result-image" class="result-image hidden" alt="Attached memory photo" />
        <button class="btn btn-primary btn-block" id="result-again">
          <svg class="icon" aria-hidden="true"><use href="#icon-rotate"/></svg>
          Pull Again
        </button>
      </div>
    </div>
  </section>

  <!-- ===== POST SCREEN ===== -->
  <section id="screen-post" class="screen screen-post hidden">
    <header class="topbar">
      <h1 class="screen-title" id="post-title">New Capsule</h1>
    </header>

    <form id="form-post" class="post-form">
      <div class="field">
        <label class="field-label" for="post-text"><span id="post-text-label">What you love</span> <span class="req">Required</span></label>
        <textarea id="post-text" required maxlength="2000" rows="5" placeholder="e.g. how they always say good morning first" lang="ja"></textarea>
      </div>

      <div class="field">
        <label class="field-label" for="post-date">
          <svg class="icon icon-inline" aria-hidden="true"><use href="#icon-calendar"/></svg>
          Date <span class="hint">optional</span>
        </label>
        <input type="date" id="post-date" />
      </div>

      <div class="field">
        <label class="field-label" for="post-image">
          <svg class="icon icon-inline" aria-hidden="true"><use href="#icon-image-plus"/></svg>
          Photo <span class="hint">optional</span>
        </label>
        <input type="file" id="post-image" accept="image/png,image/jpeg,image/webp,image/gif" />
        <img id="post-image-preview" class="image-preview hidden" alt="Selected photo preview" />
      </div>

      <div class="post-actions">
        <button type="submit" class="btn btn-primary" id="post-submit">Seal the Capsule</button>
        <button type="button" class="btn btn-ghost hidden" id="post-cancel-edit">Cancel</button>
      </div>
      <p class="form-error" id="post-error" role="alert"></p>
    </form>
  </section>

  <!-- ===== LIST SCREEN ===== -->
  <section id="screen-list" class="screen screen-list hidden">
    <header class="topbar">
      <h1 class="screen-title" id="list-title">Your Capsules</h1>
    </header>
    <div id="list-empty" class="empty-state hidden">
      <p id="list-empty-text">No capsules yet — start your collection.</p>
      <button class="btn btn-secondary" data-nav="post">Add Your First Capsule</button>
    </div>
    <div id="list-grid" class="list-grid"></div>
  </section>

  <!-- ===== BOTTOM NAV ===== -->
  <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Primary">
    <button class="nav-btn active" data-nav="home" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="#icon-house"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-nav="post">
      <svg class="icon" aria-hidden="true"><use href="#icon-pen"/></svg>
      <span>Add</span>
    </button>
    <button class="nav-btn" data-nav="list">
      <svg class="icon" aria-hidden="true"><use href="#icon-grid"/></svg>
      <span>List</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
