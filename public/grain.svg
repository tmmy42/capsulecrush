<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <!-- Collapse to neutral-gray, fully opaque noise (R=G=B=luminance,
         alpha=1) so it sits on both sides of 50% grey. Combined with
         mix-blend-mode:overlay in CSS, this only adds texture — an
         overlay blend against solid grey is a no-op, so it never
         darkens or lightens the page overall. -->
    <feColorMatrix in="noise" type="matrix"
      values="0.33 0.33 0.33 0 -0.28
              0.33 0.33 0.33 0 -0.28
              0.33 0.33 0.33 0 -0.28
              0 0 0 0 1"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
